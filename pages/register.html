     <form class="register_form">

               <h1 class="register_title">Register</h1>

               <div class="input_box">
                <i class="fa-solid fa-user"></i>
               <input type="text" id="username" placeholder="User Name" value="" required/>
             </div>

             <div class="input_box">
                <i class="fa-solid fa-envelope"></i>
               <input type="text" id="email" placeholder="Email" value=""/>
             </div>

             <div class="input_box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="password" value="" />
              </div>

             <div class="input_box">
                <i class="fa-solid fa-phone"></i>
               <input type="number" id="phone" placeholder="Phone" value="" />
             </div>

             <div class="input_box">
                <i class="fa-solid fa-location-dot"></i>
               <input type="text" id="address" placeholder="Address" value="" />
             </div>
                   
                 <button id="submit"  type="submit" class="sub">Create</button>
                
                 </p>
 
                 <div class="message_box"></div>
             </form>

             <script type="module">
       
                import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
                import { getDatabase, ref, set, child } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js"; 
               
                // Your web app's Firebase configuration
                const firebaseConfig = {
                    apiKey: "AIzaSyAEAjEVh1ucqElD0GoWb9Y3qtBwKwrgxdw",
                    authDomain: "event-management-system-2820a.firebaseapp.com",
                    projectId: "event-management-system-2820a",
                    storageBucket: "event-management-system-2820a.firebasestorage.app",
                    messagingSenderId: "640967132487",
                    appId: "1:640967132487:web:a2646c5954e4e1ac89f862"
                  };
              
                // Initialize Firebase
                const app = initializeApp(firebaseConfig);
        
                //get ref to database services
                const db = getDatabase(app);
        
              
                document.getElementById("submit").addEventListener('click', function(e){
                    e.preventDefault();
                    set(ref(db, 'user/' + document.getElementById("username").value),
                    {
                        username: document.getElementById("username").value,
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value,
                        phone: document.getElementById("phone").value,
                        address: document.getElementById("address").value,
                    });
                       alert("Registered Successfully")
        
                })

                let btnClick = document.querySelector("button");

                btnClick.addEventListener("click", () =>{
                    window.location.href = "./../pages/login.html";
                })
                
              </script>
